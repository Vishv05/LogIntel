[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf

# 1. HTTP Ingestion Port for applications and forwarders
[INPUT]
    Name          http
    Listen        0.0.0.0
    Port          8888
    Tag           logintel.http

# 2. Syslog UDP Ingestion for Network Devices & Firewalls
[INPUT]
    Name          syslog
    Mode          udp
    Listen        0.0.0.0
    Port          5140
    Parser        syslog-rfc3164
    Tag           logintel.syslog

# 3. File Tail for Server and Simulated Log Files
[INPUT]
    Name          tail
    Path          /var/log/simulated/*.log
    Parser        json_log
    Tag           logintel.file

# Filter to normalize and parse JSON payloads
[FILTER]
    Name          parser
    Match         logintel.http
    Key_Name      log
    Parser        json_log
    Reserve_Data  On

# Filter to record ingestion metadata
[FILTER]
    Name          record_modifier
    Match         logintel.*
    Record        forwarder fluent-bit

# Output 1: Send normalized logs to LogIntel FastAPI Backend
[OUTPUT]
    Name          http
    Match         logintel.*
    Host          backend
    Port          8000
    URI           /api/logs/ingest
    Format        json
    Retry_Limit   3

# Output 2: Direct indexing into OpenSearch Cluster
[OUTPUT]
    Name          opensearch
    Match         logintel.*
    Host          opensearch
    Port          9200
    Index         logintel-logs
    Type          _doc
    HTTP_User     admin
    HTTP_Passwd   admin
    tls           Off
    tls.verify    Off
    Retry_Limit   3

# Output 3: Standard Output for Docker container logs
[OUTPUT]
    Name          stdout
    Match         logintel.*
